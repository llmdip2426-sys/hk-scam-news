name: Daily Scam News Scrape

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run scraper
        run: python scrape_scam_news.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add scam_news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update scam_news.json $(date -u +%Y-%m-%d)" && git push)
          